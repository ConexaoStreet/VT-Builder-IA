<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VT Builder IA</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-side">
        <button class="icon-btn mobile-only" id="openDrawerBtn" aria-label="Abrir menu">☰</button>
      </div>

      <div class="brand">
        <div class="brand-badge">VT</div>
        <div class="brand-copy">
          <strong>VT Builder IA</strong>
          <span>Construa sites por conversa</span>
        </div>
      </div>

      <div class="topbar-side right">
        <div class="avatar">VT</div>
      </div>
    </header>

    <aside class="mobile-drawer" id="mobileDrawer">
      <div class="drawer-card">
        <div class="drawer-head">
          <strong>Projetos</strong>
          <button class="icon-btn small" id="closeDrawerBtn" aria-label="Fechar menu">✕</button>
        </div>
        <div class="drawer-list" id="drawerProjectList"></div>
      </div>
    </aside>

    <main class="dashboard-main">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">IA para criar sites</p>
          <h1>O que vamos criar hoje?</h1>
          <p class="hero-text">
            Digite o primeiro comando. A IA cria um projeto novo, gera um título automaticamente, abre um chat próprio,
            mantém histórico separado e mostra preview do site no mesmo fluxo.
          </p>
        </div>

        <section class="prompt-panel" aria-label="Criar novo projeto">
          <textarea id="projectPrompt" placeholder="Ex: Crie um site premium para uma clínica moderna, com hero forte, serviços, depoimentos, formulário e versão mobile impecável."></textarea>

          <div class="prompt-toolbar">
            <button class="circle-btn subtle" aria-label="Adicionar anexo">＋</button>

            <div class="prompt-actions">
              <button class="circle-btn subtle" aria-label="Imagem">🖼</button>
              <button class="circle-btn subtle" aria-label="Voz">🎙</button>
              <button class="circle-btn send" id="createProjectBtn" aria-label="Criar projeto">↑</button>
            </div>
          </div>
        </section>
      </section>

      <section class="tab-row">
        <button class="tab is-active" type="button">Projetos recentes</button>
        <button class="tab" type="button">Meus projetos</button>
        <button class="tab" type="button">Templates</button>
      </section>

      <section class="projects-grid" id="projectGrid"></section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
