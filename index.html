<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VT Builder IA</title>
  <meta name="theme-color" content="#0b0b10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-shell">
    <header class="dashboard-topbar">
      <div class="top-left">
        <button class="icon-btn">☰</button>
      </div>
      <div class="brand-center">
        <div class="brand-dot">VT</div>
        <strong>VT Builder IA</strong>
      </div>
      <div class="top-right">
        <div class="avatar">VT</div>
      </div>
    </header>

    <main class="dashboard-main">
      <section class="hero-stack">
        <div class="glow glow-blue"></div>
        <div class="glow glow-pink"></div>
        <div class="glow glow-orange"></div>

        <div class="hero-copy">
          <h1>O que vamos criar hoje?</h1>
          <p>Comece um projeto novo com um único comando. Depois disso, a IA abre um chat dedicado com histórico, preview do site e arquivos do projeto.</p>
        </div>

        <div class="prompt-card">
          <textarea id="projectPrompt" placeholder="Ex: Crie uma loja premium de streetwear preta e branca com cara de marca cara, catálogo forte, mobile impecável e checkout moderno."></textarea>

          <div class="prompt-actions">
            <div class="prompt-left">
              <button class="mini-circle">＋</button>
            </div>
            <div class="prompt-right">
              <button class="ghost-icon">🖼</button>
              <button class="ghost-icon">🎙</button>
              <button class="send-btn" id="createProjectBtn">↑</button>
            </div>
          </div>
        </div>
      </section>

      <section class="dashboard-tabs">
        <button class="tab active">Projetos recentes</button>
        <button class="tab">Meus projetos</button>
        <button class="tab">Templates</button>
      </section>

      <section class="project-grid">
        <article class="project-card">
          <div class="project-preview dark"></div>
          <div class="project-info">
            <strong>VT Imports</strong>
            <span>Loja streetwear premium</span>
          </div>
        </article>
        <article class="project-card">
          <div class="project-preview blue"></div>
          <div class="project-info">
            <strong>Retro Match</strong>
            <span>Camisas retrô e futebol</span>
          </div>
        </article>
        <article class="project-card">
          <div class="project-preview orange"></div>
          <div class="project-info">
            <strong>Shox Hub</strong>
            <span>Sneakers / Nike Shox</span>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
