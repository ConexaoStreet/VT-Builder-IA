<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VT Builder IA — Projeto</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-body">
  <div class="chat-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a href="index.html" class="sidebar-back">←</a>
        <button class="new-project-btn" id="newProjectBtn">Novo projeto</button>
      </div>

      <div class="sidebar-section">
        <span class="section-label">Projetos</span>
        <div class="project-list" id="sidebarProjectList"></div>
      </div>

      <div class="sidebar-section">
        <span class="section-label">Arquivos</span>
        <div class="file-list" id="fileList">
          <button type="button">index.html</button>
          <button type="button">styles.css</button>
          <button type="button">app.js</button>
          <button type="button">components/hero.js</button>
          <button type="button">components/cards.js</button>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-topbar">
        <div class="chat-topbar-left">
          <button class="icon-btn mobile-only" id="toggleSidebarBtn" aria-label="Abrir barra lateral">☰</button>
          <div>
            <small>Projeto ativo</small>
            <h1 id="chatTitle">Novo Projeto</h1>
          </div>
        </div>

        <div class="chat-topbar-actions">
          <button class="pill-btn" type="button">Código</button>
          <button class="pill-btn" type="button">Deploy</button>
          <button class="pill-btn primary" type="button">Publicar</button>
        </div>
      </header>

      <div class="chat-content">
        <section class="conversation" id="chatHistory"></section>

        <section class="composer-wrap">
          <div class="composer">
            <textarea id="chatInput" placeholder="Peça mudanças no site, crie páginas, refine o visual, troque fontes, melhore o mobile..."></textarea>

            <div class="composer-actions">
              <div class="composer-left">
                <button class="circle-btn subtle" type="button">＋</button>
                <button class="circle-btn subtle" type="button">📎</button>
                <button class="circle-btn subtle" type="button">🖼</button>
              </div>

              <button class="circle-btn send" id="sendMessageBtn" type="button">↑</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <aside class="preview-panel">
      <div class="preview-head">
        <strong>Preview ao vivo</strong>
        <div class="preview-modes">
          <button class="mode-btn is-active" type="button">Desktop</button>
          <button class="mode-btn" type="button">Mobile</button>
        </div>
      </div>

      <div class="browser-frame">
        <div class="browser-dots">
          <span></span><span></span><span></span>
        </div>

        <div class="site-canvas">
          <div class="site-header">
            <div class="site-logo"></div>
            <div class="site-nav"></div>
          </div>

          <div class="site-hero">
            <div class="site-copy-card">
              <span class="site-chip">Preview inicial</span>
              <h2 id="previewTitle">Seu site está sendo construído</h2>
              <p id="previewDesc">A primeira versão aparece aqui e evolui conforme a conversa continua.</p>
              <div class="site-buttons">
                <span></span>
                <span></span>
              </div>
            </div>

            <div class="site-visual-card"></div>
          </div>

          <div class="site-grid">
            <div></div>
            <div></div>
            <div></div>
          </div>

          <div class="site-strip"></div>
        </div>
      </div>
    </aside>
  </div>

  <script src="chat.js"></script>
</body>
</html>
